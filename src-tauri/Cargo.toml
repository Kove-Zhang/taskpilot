[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-sql = "2"
aes-gcm = "0.10.3"
rand = "0.9.5"
base64 = "0.22.1"
tauri-plugin-http = "2.5.9"
tauri-plugin-store = "2.4.4"
machine-uid = "0.6.0"
sha2 = "0.10.9"
imap = "2.4.1"
native-tls = "0.2.13"
mailparse = "0.16.1"
chrono = "0.4.45"
keyring = "3.6.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
